[model]
name = "facebook/dinov2-base"
feature_type = "dinov2"
image_size = 224
device = "auto"
n_register_tokens = 0
do_center_crop = false

[intensity]

[extraction]
apply_image_mask = true
apply_patch_mask = true
skip_empty_slices = true
slice_axis = 0
slice_step = 1
crop_to_mask = false
min_mask_pixels = 1
remove_small_holes = false
hole_area_threshold = 512
mirror_mask_y = false

[output]
include_flat_patches = false
